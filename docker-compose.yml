services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-projects}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-projects}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for AWS S3 + Lambda so you can develop without touching
  # the sandbox account. Drop this service once you point at real AWS.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,lambda
      DEBUG: "0"
      LAMBDA_EXECUTOR: docker
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack:/var/lib/localstack

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Bind mount + --reload gives you live editing without rebuilds.
      - ./app:/code/app
      # So `alembic revision --autogenerate` writes migration files back to
      # the host instead of leaving them stranded in an ephemeral container.
      - ./alembic:/code/alembic
      - ./tests:/code/tests
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  localstack:
